name: Deploy Dockerization App in AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: lingaraj-dev-repo
  ECS_CLUSTER: lingaraj-dev-cluster
  ECS_SERVICE: lingaraj-dev-service
  ECS_TASK_DEFINITION: lingaraj-dev-task
  CONTAINER_NAME: lingaraj-dev-container

#Here, we have two jobs like testing and deployment. The testing job will run first and if it is successful then only the deployment job will run.
jobs:
  #1st job for environment setup and testing
  test:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      
      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      #4. Run tests
      - name: Run tests
        run: npm test
  
  #2nd job for deploying. It is deplends on the 1st job(test). If test job passes, then only deploy job will execute.
  deploy:
    #deploy job need `test` job as it's dependancy
    needs: test
    runs-on: ubuntu-latest

    #steps for aws configuration that is push our docker image to ECR and manage the container on ECS etc.
    steps:
      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Configure AWS to login to AWS CLI to execute the code like docker build, run container, etc.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      # 3. Login to ECR
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build and push Docker image
      - name: Build and push docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{env.ECR_REPOSITORY}}:${{env.IMAGE_TAG}} .
          docker push $ECR_REGISTRY/${{env.ECR_REPOSITORY}}:${{env.IMAGE_TAG}} .
      
      # 5. Download current ECS task definition
      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json

      # 6. Replace container image
      - name: Update task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 7. Deploy to ECS
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true



